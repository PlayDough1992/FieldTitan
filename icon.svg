<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Titan Shield -->
  <path d="M 256 80 L 380 136 C 380 260 330 354 256 416 C 182 354 132 260 132 136 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />

  <!-- Inner Crest / Bolt Highlight -->
  <path d="M 256 120 L 350 162 C 350 254 312 328 256 376 C 200 328 162 254 162 162 Z" 
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Lightning / Wrench Energy Symbol -->
  <path d="M 272 164 L 208 268 L 252 268 L 240 348 L 308 244 L 264 244 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)" />
</svg>
